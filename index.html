<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>팀 일정 공유 — 하루 타임테이블</title>
<meta name="description" content="9명이 함께 쓰는 하루 일정 타임테이블. 각자의 일정을 등록해 서로 공유하고, 모두가 비는 시간에 회의를 잡습니다." />
<meta name="robots" content="noindex" />
<!-- 홈 화면에 설치해 앱처럼 쓰기 위한 설정 -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2A4A6B" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="팀일정" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-1: #3E6288; --navy-2: #2A4A6B; --navy-3: #1F3A55;
    --deep: #1E3A50; --paper: #FFFFFF;
    --soft: #EEF3F7; --line: #DCE4EC; --muted: #4E6076; --faint: #8CA0B3;
    --gold: #C7B48E; --brass: #A9884F;
    --free: #3E7A55;
    --sans: 'Noto Sans KR', sans-serif;
    --slot-h: 36px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); color: var(--deep); background: #F6F8FA; line-height: 1.6; word-break: keep-all; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; color: var(--deep); }

  .top-accent { position: fixed; top: 0; left: 0; right: 0; height: 6px; z-index: 60;
    background: linear-gradient(90deg, var(--brass), var(--gold) 45%, var(--brass)); }

  /* ── 상단 바 ── */
  .bar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding-top: 6px; }
  .bar-in { max-width: 1360px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 15px; letter-spacing: .04em; }
  .brand img { height: 26px; width: auto; }
  .brand .sub { font-weight: 500; color: var(--brass); font-size: 13px; }

  .date-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .date-nav .nav-btn { width: 34px; height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 9px;
    font-size: 15px; color: var(--navy-2); }
  .date-nav .nav-btn:hover { background: var(--soft); }
  .date-label { position: relative; border: 1px solid var(--line); background: #fff; border-radius: 9px;
    padding: 6px 13px; font-size: 14.5px; font-weight: 700; color: var(--deep); display: flex; align-items: center; gap: 7px; }
  .date-label:hover { background: var(--soft); }
  .date-label .dow { color: var(--brass); }
  .date-label input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .today-btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 12px; font-size: 13px;
    font-weight: 700; color: var(--navy-2); }
  .today-btn:hover { background: var(--soft); }
  .meet-btn { border: 0; background: var(--navy-2); color: #fff; border-radius: 9px; padding: 8px 15px; font-size: 13.5px; font-weight: 700; }
  .meet-btn:hover { background: var(--navy-3); }
  .meet-btn.on { background: var(--brass); }

  .status { font-size: 12px; color: var(--faint); width: 100%; text-align: right; margin-top: -4px; }
  .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #56A06E; margin-right: 4px; vertical-align: 1px; }
  .status.local .dot { background: #D0A24A; }

  .notice { max-width: 1360px; margin: 12px auto 0; padding: 0 16px; }
  .notice .inner { background: #FBF4E3; border: 1px solid #E8D8B0; color: #7A5F2C; border-radius: 11px;
    padding: 10px 14px; font-size: 13px; }
  .notice .inner button { margin-left: 8px; border: 1px solid #D8C48E; background: #fff; color: #7A5F2C;
    border-radius: 7px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .notice .inner button:hover { background: #F5EDD8; }

  /* ── 회의 시간 찾기 패널 ── */
  .meet-panel { max-width: 1360px; margin: 12px auto 0; padding: 0 16px; display: none; }
  .meet-panel.open { display: block; }
  .meet-inner { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 15px 16px; }
  .meet-inner h3 { font-size: 14.5px; margin-bottom: 9px; }
  .meet-inner h3 span { color: var(--brass); font-weight: 500; font-size: 12.5px; margin-left: 8px; }
  .meet-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 9px; }
  .meet-row label.opt { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px;
    padding: 4px 11px 4px 8px; font-size: 12.5px; cursor: pointer; user-select: none; background: #fff; }
  .chip input { accent-color: var(--navy-2); }
  .chip .sw { width: 9px; height: 9px; border-radius: 3px; }
  .meet-row select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: #fff; }
  .free-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .free-item { border: 1px solid #BCD9C6; background: #EFF7F1; color: var(--free); border-radius: 9px;
    padding: 6px 12px; font-size: 13px; font-weight: 700; }
  .free-item:hover { background: #DFEFE4; }
  .free-none { font-size: 13px; color: var(--faint); }

  /* ── 타임테이블 ── */
  .board-wrap { max-width: 1360px; margin: 14px auto 60px; padding: 0 16px; }
  .board { overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    max-height: calc(100vh - 150px); }
  .grid { display: grid; min-width: 1150px; position: relative; --slot-h: 36px; }
  /* 좁은 화면: 가로 스크롤 없이 팀원 전체가 한 화면에 들어오도록 압축 */
  .grid.compact { min-width: 0; --slot-h: 28px; }
  .grid.compact .hcell { font-size: 9.5px; padding: 7px 1px; letter-spacing: -.03em; }
  .grid.compact .hcell .csw, .grid.compact .hcell .pen { display: none; }
  .grid.compact .hcell.corner { font-size: 9.5px; }
  .grid.compact .hcell.addcol { font-size: 13px; }
  .grid.compact .timecol .t { font-size: 9.5px; padding: 1px 3px 0 0; }
  .grid.compact .timecol .t .mm { display: none; }
  .grid.compact .timecol .t.half { font-size: 0; }
  .grid.compact .entry { font-size: 9px; padding: 2px 3px; left: 1px; right: 1px; border-radius: 5px;
    border-left-width: 3px; }
  /* 좁은 열에서는 제목을 여러 줄로 흘려 최대한 보이게 */
  .grid.compact .entry b { font-size: 9px; white-space: normal; word-break: break-all; line-height: 1.15; }
  .grid.compact .entry .tm { display: none; }
  .grid.compact .entry.band .who { font-size: 8.5px; padding: 0 6px; }
  .grid.compact .lunch-band span { font-size: 9px; letter-spacing: .2em; }
  .hcell { position: sticky; top: 0; z-index: 4; background: var(--navy-2); color: #fff; font-size: 13.5px; font-weight: 700;
    padding: 10px 6px; text-align: center; border-left: 1px solid rgba(255,255,255,.14); cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .hcell .csw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .hcell .pen { opacity: .45; font-size: 11px; margin-left: 5px; }
  .hcell:hover .pen { opacity: .9; }
  .hcell.corner { left: 0; z-index: 6; cursor: default; border-left: 0; background: var(--navy-3); font-size: 12.5px; }
  .hcell.addcol { background: var(--navy-3); color: var(--gold); font-size: 17px; font-weight: 400; }
  .hcell.addcol:hover { color: #fff; }
  .timecol { position: sticky; left: 0; z-index: 3; background: #FBFCFD; border-right: 1px solid var(--line); }
  .timecol .t { height: var(--slot-h); font-size: 11.5px; color: var(--muted); text-align: right; padding: 2px 8px 0 0;
    white-space: nowrap;
    border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .timecol .t.half { color: #B4C2CF; border-top-color: #EDF1F5; font-size: 10.5px; }
  .mcol { position: relative; border-left: 1px solid var(--line); }
  .mcol .slot { height: var(--slot-h); border-top: 1px solid #EDF1F5; cursor: pointer; }
  .mcol .slot.hour { border-top-color: var(--line); }
  .mcol .slot:hover { background: #F1F6FA; }
  .mcol .slot.lunch { background: #FAF7F0; }

  .entry { position: absolute; left: 3px; right: 3px; border-radius: 8px; padding: 4px 7px; overflow: hidden; cursor: grab;
    font-size: 12px; line-height: 1.35; border: 1px solid transparent; z-index: 3; background-color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  .entry:hover { filter: brightness(.97); box-shadow: 0 2px 8px rgba(30,58,80,.16); }
  .entry.dragging { opacity: .95; box-shadow: 0 8px 20px rgba(30,58,80,.3); z-index: 8; cursor: grabbing; }
  .entry.armed { box-shadow: 0 0 0 2px var(--brass), 0 6px 16px rgba(30,58,80,.28); z-index: 8; }
  .entry .rz { position: absolute; left: 0; right: 0; height: 7px; cursor: ns-resize; }
  .entry .rz-top { top: 0; } .entry .rz-bot { bottom: 0; }
  /* 드래그 중 시간 표시 — 작은 화면에서도 몇 시로 옮겨지는지 크게 보이게 */
  .entry .livetime { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(31,58,85,.92); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .02em;
    padding: 3px 10px; border-radius: 99px; white-space: nowrap; pointer-events: none; z-index: 2; }

  /* 손가락 조작 기기: 시간 조절 손잡이를 크게 + 눈에 보이게 */
  body.touch .entry { touch-action: auto; }
  body.touch .entry .rz { height: 16px; }
  body.touch .entry.short .rz { height: 9px; }
  body.touch .entry .rz::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    width: 20px; height: 3px; border-radius: 2px; background: currentColor; opacity: .3; }
  body.touch .entry .rz-top::after { top: 2px; }
  body.touch .entry .rz-bot::after { bottom: 2px; }
  body.touch .entry.armed .rz::after { opacity: .85; background: var(--brass); width: 26px; height: 4px; }
  /* 여러 명이 함께하는 공통 일정 — 해당 열들을 가로로 잇는 하나의 막대 */
  .span-layer { position: absolute; inset: 0; pointer-events: none; }
  .entry.band { right: auto; z-index: 2; pointer-events: auto; display: flex; align-items: center; gap: 9px; }
  .entry.band b { flex: none; }
  .entry.band .tm { flex: none; }
  .entry.band .who { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #fff;
    background: rgba(42,74,107,.72); border-radius: 99px; padding: 1px 9px; flex: none; }
  .entry b { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .tm { opacity: .75; font-size: 10.5px; font-variant-numeric: tabular-nums; }

  .lunch-band { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; display: flex;
    align-items: center; justify-content: center; }
  .lunch-band span { font-size: 12px; letter-spacing: .5em; color: #C9B78C; font-weight: 700; padding-left: .5em; }
  .free-band { position: absolute; left: 0; right: 0; z-index: 1; background: rgba(86,160,110,.14);
    border-top: 2px dashed #7DB893; border-bottom: 2px dashed #7DB893; cursor: pointer; }
  .free-band:hover { background: rgba(86,160,110,.22); }
  .now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid #D26060; z-index: 3; pointer-events: none; }
  .now-line::before { content: ''; position: absolute; left: 0; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: #D26060; }

  /* ── 모달 ── */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,34,48,.45); z-index: 90; display: none;
    align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 15px; width: 100%; max-width: 430px; padding: 22px;
    box-shadow: 0 18px 50px rgba(15,30,45,.3); max-height: 90vh; overflow: auto; }
  .modal h3 { font-size: 16.5px; margin-bottom: 15px; }
  .f-row { margin-bottom: 12px; }
  .f-row label.t { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
  .f-row input[type=text], .f-row textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
  .f-row textarea { resize: vertical; min-height: 58px; }
  .f-row input:focus, .f-row textarea:focus, .f-row select:focus { outline: 2px solid rgba(62,98,136,.35); border-color: var(--navy-1); }
  .time-pair { display: flex; align-items: center; gap: 8px; }
  .time-pair select { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 8px; background: #fff; }
  .mem-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .modal .btns { display: flex; gap: 8px; margin-top: 18px; }
  .btn { border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: #fff; color: var(--muted); }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--navy-2); border-color: var(--navy-2); color: #fff; flex: 1; }
  .btn.primary:hover { background: var(--navy-3); }
  .btn.danger { color: #B14A4A; border-color: #E4C6C6; }
  .btn.danger:hover { background: #FBF1F1; }
  .err { color: #B14A4A; font-size: 12.5px; margin-top: 8px; display: none; }
  .err.show { display: block; }

  /* ── 엑셀 주고받기 ── */
  .xl-sec { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .xl-sec:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .xl-t { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .xl-help { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
  .xl-help code { background: var(--soft); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }
  .xl-sec input[type=file] { width: 100%; font-size: 12.5px; border: 1px dashed var(--line); border-radius: 9px;
    padding: 10px; background: #FBFCFD; }
  .xl-sec input[type=date] { flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 8px; background: #fff; }
  .xl-preview { margin-top: 10px; font-size: 12.5px; }
  .xl-preview .sum { background: var(--soft); border-radius: 9px; padding: 9px 11px; line-height: 1.6; }
  .xl-preview .sum b { color: var(--navy-2); }
  .xl-preview .bad { margin-top: 8px; background: #FBF1F1; border: 1px solid #E4C6C6; color: #8E4141;
    border-radius: 9px; padding: 8px 11px; max-height: 120px; overflow: auto; font-size: 11.5px; line-height: 1.5; }
  .xl-preview .warn { margin-top: 8px; background: #FBF4E3; border: 1px solid #E8D8B0; color: #7A5F2C;
    border-radius: 9px; padding: 8px 11px; font-size: 11.5px; }

  .hint-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 95;
    background: rgba(31,58,85,.94); color: #fff; font-size: 13px; line-height: 1.5; text-align: center;
    padding: 11px 16px; border-radius: 12px; max-width: min(92vw, 360px); box-shadow: 0 8px 24px rgba(0,0,0,.28);
    transition: opacity .4s; }
  .hint-toast.out { opacity: 0; }

  #wideBtn { display: none; }
  @media (max-width: 760px) {
    #wideBtn { display: inline-block; }
    .bar-in { padding: 8px 8px; gap: 6px; }
    .brand .sub { display: none; }
    .brand { font-size: 13.5px; }
    .board-wrap, .notice, .meet-panel { padding: 0 6px; }
    .board-wrap { margin: 8px auto 14px; }
    .board { max-height: calc(100dvh - 132px); border-radius: 10px; }
    .bar-in { padding: 6px 8px 4px; gap: 5px; }
    .status { font-size: 11px; margin-top: -2px; }
    .date-nav { margin-left: auto; gap: 4px; }
    .date-nav .nav-btn { width: 30px; height: 30px; }
    .date-label { padding: 5px 9px; font-size: 13px; }
    .today-btn { padding: 5px 9px; font-size: 12px; }
    .meet-btn { padding: 7px 10px; font-size: 12.5px; }
  }
  @media (max-width: 640px) {
    .brand .name { display: none; }
  }
</style>
</head>
<body>
<div class="top-accent"></div>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="name">팀 일정 공유</span><span class="sub">Daily Timetable</span>
    </div>
    <div class="date-nav">
      <button class="nav-btn" id="prevDay" title="이전 날">◀</button>
      <div class="date-label" id="dateLabel">
        <span id="dateText">…</span>
        <input type="date" id="datePick" />
      </div>
      <button class="nav-btn" id="nextDay" title="다음 날">▶</button>
      <button class="today-btn" id="todayBtn">오늘</button>
    </div>
    <button class="today-btn" id="copyBtn" title="오늘 일정표를 이미지로 복사해 카톡·텔레그램에 붙여넣기">📷 복사</button>
    <button class="today-btn" id="xlBtn" title="엑셀로 내려받기 / 엑셀로 일정 올리기">📊 엑셀</button>
    <button class="today-btn" id="wideBtn" title="넓게 보기 / 한 화면에 보기">↔ 넓게</button>
    <button class="today-btn" id="installBtn" style="display:none" title="홈 화면에 앱으로 추가">📲 앱 설치</button>
    <button class="meet-btn" id="allAddBtn" style="background:var(--brass)" title="모든 팀원에게 같은 일정을 한 번에 등록">📌 전체 일정 추가</button>
    <button class="meet-btn" id="meetToggle">🕐 회의 시간 찾기</button>
    <div class="status" id="status"><span class="dot"></span>연결 확인 중…</div>
  </div>
</header>

<div class="notice" id="localNotice" style="display:none">
  <div class="inner" id="localNoticeText"></div>
</div>

<div class="meet-panel" id="meetPanel">
  <div class="meet-inner">
    <h3>모두가 비는 시간 찾기 <span>참석자를 고르면 겹치는 빈 시간을 표에 초록색으로 표시합니다</span></h3>
    <div class="meet-row" id="meetMembers"></div>
    <div class="meet-row">
      <label class="opt">시간대
        <select id="meetFrom"></select> ~ <select id="meetTo"></select>
      </label>
      <label class="opt">최소
        <select id="meetDur">
          <option value="30">30분</option>
          <option value="60" selected>1시간</option>
          <option value="90">1시간 30분</option>
          <option value="120">2시간</option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="meetSkipLunch" checked /> 점심시간(12~13시) 제외</label>
    </div>
    <div class="free-list" id="freeList"></div>
  </div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- 일정 추가/수정 모달 -->
<div class="modal-bg" id="entryModalBg">
  <div class="modal">
    <h3 id="entryModalTitle">일정 추가</h3>
    <div class="f-row">
      <label class="t">제목</label>
      <input type="text" id="fTitle" maxlength="60" placeholder="예: ○○○ 미팅, 외근, 교육 …" />
    </div>
    <div class="f-row">
      <label class="t">시간</label>
      <div class="time-pair">
        <select id="fStart"></select><span>~</span><select id="fEnd"></select>
      </div>
    </div>
    <div class="f-row" id="fMemRow">
      <label class="t">대상 (여러 명을 고르면 각자의 칸에 같은 일정이 들어갑니다)</label>

</div>

<div class="modal-bg" id="nameModalBg">
  <div class="modal">
    <h3 id="nTitle">이름 변경</h3>
    <div class="f-row">
      <input type="text" id="nName" maxlength="20" placeholder="이름" />
    </div>
    <div class="btns">
      <button class="btn danger" id="nDelete" style="display:none">팀원 제거</button>
      <button class="btn" id="nCancel">취소</button>
      <button class="btn primary" id="nSave">저장</button>
    </div>

<script>
(function () {
  'use strict';

  // ── 시간 상수: 06:00 ~ 22:00, 30분 단위 ──
  var DAY_START = 6 * 60, DAY_END = 22 * 60, STEP = 30;
  var SLOT_H = 36;              // 한 칸(30분) 높이 — 좁은 화면에서는 28px로 줄어든다
  var COMPACT_W = 760;          // 이 폭 이하이면 '한 화면에 보기'
  var SLOTS = (DAY_END - DAY_START) / STEP;
  var LUNCH_S = 12 * 60, LUNCH_E = 13 * 60;
  var API = '/api/schedule';
  var LS_KEY = 'mlk-team-schedule-v1';

  var state = {
    date: todayStr(),
    members: [],
    entries: [],
    mode: null,            // 'server' | 'local'
    meetOpen: false,
    meetSel: {},           // member_id -> bool
    wide: localStorage.getItem('mlk-sched-wide') === '1', // 좁은 화면에서 넓게 보기
    cachedAt: null,
    freeWindows: []
  };
  var editingGroup = null; // 수정 중인 일정(공통 일정이면 여러 건)
  var renamingId = null;

  // ── 유틸 ──
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtMin(m) {
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  function dowKo(dateStr) {
    return ['일', '월', '화', '수', '목', '금', '토'][new Date(dateStr + 'T00:00:00').getDay()];
  }
  function shiftDate(dateStr, days) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function hexToRgba(hex, a) {
    var h = (hex || '#3E6288').replace('#', '');
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ── 로컬 저장소 (서버 미연결 시 대체) ──
  function localLoad() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
  }
  function localSave(db) { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  // 서버에서 받은 하루치를 보관 — 오프라인일 때 이걸 보여준다(최근 14일치만 유지)
  function cacheDay(date, members, entries) {
    try {
      var db = localLoad();
      db.cache = db.cache || {};
      db.cache[date] = { members: members, entries: entries, at: new Date().toISOString() };
      var days = Object.keys(db.cache).sort();
      while (days.length > 14) delete db.cache[days.shift()];
      localSave(db);
    } catch (e) { /* 저장 공간이 없으면 무시 */ }
  }
  function cachedDay(date) {
    var db = localLoad();
    return (db.cache && db.cache[date]) || null;
  }
  function assertWritable() {
    if (state.mode === 'offline') throw { offline: true };
  }
  function writeErrMsg(ex, fallback) {
    return (ex && ex.offline)
      ? '오프라인 상태에서는 변경할 수 없습니다. 연결된 뒤 다시 시도해 주세요.'
      : fallback;
  }
  function localDefaults() {
    var colors = ['#3E6288', '#A9884F', '#5E8D66', '#B56576', '#6D597A', '#C97B4A', '#40878A', '#7D6FA0', '#8B6D5C'];
    return colors.map(function (c, i) { return { id: 'm' + (i + 1), name: '팀원 ' + (i + 1), color: c, sort: i + 1 }; });
  }

  // ── 데이터 액세스 (서버 ↔ 로컬 자동 전환) ──
  async function loadDay(silent) {
    var date = state.date;
    if (state.mode !== 'local') {
      try {
        var r = await fetch(API + '?date=' + date);
        if (!r.ok) {
          var body = null;
          try { body = await r.json(); } catch (ignored) {}
          throw { status: r.status, detail: (body && (body.detail || body.error)) || '', body: body };
        }
        var j = await r.json();
        if (date !== state.date) return; // 로딩 중 날짜가 바뀐 경우 무시
        state.mode = 'server';
        state.serverErr = null;
        state.members = j.members || [];
        state.entries = j.entries || [];
        cacheDay(date, j.members, j.entries); // 오프라인에서 볼 수 있게 보관
        setStatus();
        render();
        maybeMigrateLocal();
        return;
      } catch (e) {
        if (state.mode === 'server' && !(e && e.status === 503)) {
          if (!silent) setStatus('서버 응답 없음 — 잠시 후 다시 시도합니다');
          return; // 일시 오류: 기존 화면 유지
        }
        state.serverErr = (e && typeof e.status === 'number')
          ? e : { status: 0, detail: '네트워크 오류' };
        // 서버는 있는데 연결이 안 되는 상황 — 마지막으로 받아둔 일정을 보여준다(읽기 전용)
        var cached = e && e.status !== 503 ? cachedDay(date) : null;
        if (cached) {
          state.mode = 'offline';
          state.cachedAt = cached.at;
          state.members = cached.members || [];
          state.entries = cached.entries || [];
          setStatus();
          render();
          return;
        }
        state.mode = 'local'; // 미설정/최초 실패 → 로컬 모드
      }
    }
    var db = localLoad();
    if (!db.members || !db.members.length) { db.members = localDefaults(); db.entries = {}; localSave(db); }
    state.members = db.members;
    state.entries = (db.entries && db.entries[date]) || [];
    setStatus();
    render();
  }

  async function saveEntryRow(row) {
    assertWritable();
    if (state.mode === 'server') {
      var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'entry', entry: row }) });
      if (!r.ok) throw new Error('save');
    } else {
      var db = localLoad();
      db.entries = db.entries || {};
      var list = (db.entries[row.date] = db.entries[row.date] || []);
      var i = list.findIndex(function (x) { return x.id === row.id; });
      if (i >= 0) list[i] = row; else list.push(row);
      localSave(db);
    }
  }
  async function deleteEntryRow(id) {
    assertWritable();
    if (state.mode === 'server') {
      var r = await fetch(API + '?id=' + encodeURIComponent(id), { method: 'DELETE' });
      if (!r.ok) throw new Error('delete');
    } else {
      var db = localLoad();
      var list = (db.entries && db.entries[state.date]) || [];
      db.entries[state.date] = list.filter(function (x) { return x.id !== id; });
      localSave(db);
    }
  }
  async function saveMemberName(id, name) {
    assertWritable();
    if (state.mode === 'server') {
      var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'member', id: id, name: name }) });
      if (!r.ok) throw new Error('member');
    } else {
      var db = localLoad();
      (db.members || []).forEach(function (m) { if (m.id === id) m.name = name; });
      localSave(db);
    }
  }
  var PALETTE = ['#3E6288', '#A9884F', '#5E8D66', '#B56576', '#6D597A', '#C97B4A', '#40878A', '#7D6FA0', '#8B6D5C'];
  async function postMemberRow(row) {
    var r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'member-add', member: row }) });
    if (!r.ok) throw new Error('member-add');
  }
  async function addMemberRow(name) {
    assertWritable();
    var used = state.members.map(function (m) { return m.color; });
    var color = PALETTE.filter(function (c) { return used.indexOf(c) === -1; })[0] ||
      PALETTE[state.members.length % PALETTE.length];
    var sort = state.members.reduce(function (mx, m) { return Math.max(mx, m.sort || 0); }, 0) + 1;
    var row = { id: 'm' + uid(), name: name, color: color, sort: sort };
    state.members = state.members.concat([row]); // 연달아 추가할 때 색·순서가 겹치지 않도록
    if (state.mode === 'server') {
      await postMemberRow(row);
    } else {
      var db = localLoad();
      (db.members = db.members || []).push(row);
      localSave(db);
    }
  }
  async function removeMemberRow(id) {
    assertWritable();
    if (state.mode === 'server') {
      var r = await fetch(API + '?member=' + encodeURIComponent(id), { method: 'DELETE' });
      if (!r.ok) throw new Error('member-del');
    } else {
      var db = localLoad();
      db.members = (db.members || []).filter(function (m) { return m.id !== id; });
      Object.keys(db.entries || {}).forEach(function (d) {
        db.entries[d] = db.entries[d].filter(function (e) { return e.member_id !== id; });
      });
      localSave(db);
    }
  }

  function setStatus(text) {
    var s = el('status');
    if (text) { s.innerHTML = '<span class="dot"></span>' + esc(text); return; }
    if (state.mode === 'local') {
      s.className = 'status local';
      s.innerHTML = '<span class="dot"></span>오프라인 모드 (이 브라우저에만 저장)';
      renderLocalNotice();
      el('localNotice').style.display = '';
    } else if (state.mode === 'offline') {
      s.className = 'status local';
      var at = state.cachedAt ? new Date(state.cachedAt) : null;
      s.innerHTML = '<span class="dot"></span>오프라인 — 보기 전용' +
        (at ? ' · ' + String(at.getHours()).padStart(2, '0') + ':' +
              String(at.getMinutes()).padStart(2, '0') + ' 기준' : '');
      renderLocalNotice();
      el('localNotice').style.display = '';
    } else {
      s.className = 'status';
      var t = new Date();
      s.innerHTML = '<span class="dot"></span>팀 공유 중 · ' +
        String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ' 업데이트';
      el('localNotice').style.display = 'none';
    }
  }

  // 연결 실패 원인을 배너에 구체적으로 안내
  function renderLocalNotice() {
    var err = state.serverErr || {};
    var msg;
    if (state.mode === 'offline') {
      msg = '📴 인터넷에 연결되어 있지 않아 <b>마지막으로 받은 일정</b>을 보여주고 있습니다. ' +
        '연결되면 자동으로 최신 상태가 됩니다. (이 상태에서는 일정을 바꿀 수 없습니다)';
    } else if (err.status === 503) {
      var b = err.body || {};
      var missing = [];
      if ('hasUrl' in b) {
        if (!b.hasUrl) missing.push('<code>SUPABASE_URL</code>');
        if (!b.hasKey) missing.push('<code>SUPABASE_SERVICE_KEY</code>');
      }
      msg = (missing.length
          ? '환경변수 ' + missing.join(' · ') + ' 이(가) 서버에 등록되어 있지 않습니다. ' +
            'Vercel 환경 변수에서 이름 철자를 확인해 주세요.'
          : '서버 저장이 아직 설정되지 않아 <b>이 브라우저에만</b> 저장됩니다. Vercel에 ' +
            '<code>SUPABASE_URL</code> · <code>SUPABASE_SERVICE_KEY</code> 환경변수를 등록해 주세요.') +
        ' 등록/수정 후에는 <b>재배포(Redeploy)</b>해야 반영됩니다.';
    } else {
      var d = String(err.detail || '');
      var dl = d.toLowerCase();
      var hint = '';
      if (/does not exist|schema cache|find the table/.test(dl)) {
        hint = ' → Supabase <b>SQL Editor</b>에서 테이블 생성 SQL을 아직 실행하지 않은 것 같습니다.';
      } else if (/invalid api key|jwt|unauthorized|401|403/.test(dl)) {
        hint = ' → Vercel의 <code>SUPABASE_SERVICE_KEY</code> 값(Secret key)이 올바른지 확인해 주세요.';
      } else if (/fetch failed|enotfound|getaddrinfo|econn|abort/.test(dl)) {
        hint = ' → Vercel의 <code>SUPABASE_URL</code> 값이 올바른지 확인해 주세요.';
      }
      msg = '⚠️ 서버 연결에 실패해 <b>이 브라우저에만</b> 저장 중입니다. ' +
        '<b>오류:</b> ' + esc(d || ('HTTP ' + err.status)) + hint;
    }
    el('localNoticeText').innerHTML = msg + ' <button id="retryConn">다시 연결 시도</button>';
    el('retryConn').addEventListener('click', function () {
      state.mode = null; state.serverErr = null;
      setStatus('서버에 다시 연결하는 중…');
      loadDay();
    });
  }

  // 서버 연결 성공 시, 오프라인 모드에서 저장해 둔 이름/일정을 서버로 옮길지 한 번 묻는다
  var migrationChecked = false;
  async function maybeMigrateLocal() {
    if (migrationChecked) return;
    migrationChecked = true;
    var db = localLoad();
    if (!db.members || db.migrated) return;
    var renamed = db.members.filter(function (m) { return !/^팀원 \d+$/.test(m.name); });
    var entryCount = Object.keys(db.entries || {}).reduce(function (n, d) {
      return n + db.entries[d].length;
    }, 0);
    if (!renamed.length && !entryCount) return;
    var serverFresh = state.members.every(function (m) { return /^팀원 \d+$/.test(m.name); }) &&
      !state.entries.length;
    if (!serverFresh) { db.migrated = true; localSave(db); return; }
    if (confirm('서버가 연결되었습니다!\n오프라인 모드에서 이 브라우저에 저장해 둔 팀원 이름과 일정 ' +
        entryCount + '건을 팀 서버로 올릴까요?')) {
      try {
        for (var i = 0; i < db.members.length; i++) {
          var m = db.members[i];
          var sv = state.members.find(function (x) { return x.id === m.id; });
          if (sv && sv.name !== m.name) await saveMemberName(m.id, m.name);
          if (!sv) await postMemberRow(m);
        }
        var dates = Object.keys(db.entries || {});
        for (var d2 = 0; d2 < dates.length; d2++) {
          var list = db.entries[dates[d2]];
          for (var k = 0; k < list.length; k++) await saveEntryRow(list[k]);
        }
      } catch (ex) { alert('일부 데이터를 옮기지 못했습니다. 화면에서 직접 확인해 주세요.'); }
    }
    db.migrated = true; localSave(db);
    await loadDay(true);
  }

  // ── 렌더링 ──
  function render() {
    renderDate();
    renderBoard();
    renderMeetPanel();
  }

  function renderDate() {
    var p = state.date.split('-');
    el('dateText').innerHTML = p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일 <span class="dow">(' + dowKo(state.date) + ')</span>';
    el('datePick').value = state.date;
  }

  function renderBoard() {
    var members = state.members;
    var compact = isCompact();
    SLOT_H = compact ? 28 : 36;
    var grid = document.createElement('div');
    grid.className = 'grid' + (compact ? ' compact' : '');
    grid.style.gridTemplateColumns = compact
      ? '30px repeat(' + members.length + ', minmax(0, 1fr)) 22px'
      : '58px repeat(' + members.length + ', minmax(112px, 1fr)) 44px';

    // 헤더
    var corner = document.createElement('div');
    corner.className = 'hcell corner';
    corner.textContent = '시간';
    grid.appendChild(corner);
    members.forEach(function (m) {
      var h = document.createElement('div');
      h.className = 'hcell';
      h.title = '이름 변경';
      h.innerHTML = '<span class="csw" style="background:' + esc(m.color || '#C7B48E') + '"></span>' + esc(m.name) + '<span class="pen">✎</span>';
      h.style.borderBottom = '3px solid ' + (m.color || '#C7B48E');
      h.addEventListener('click', function () { openNameModal(m); });
      grid.appendChild(h);
    });
    var addH = document.createElement('div');
    addH.className = 'hcell addcol';
    addH.title = '팀원 추가';
    addH.textContent = '＋';
    addH.addEventListener('click', openMemberAddModal);
    grid.appendChild(addH);

    // 시간 열
    var tc = document.createElement('div');
    tc.className = 'timecol';
    for (var s = 0; s < SLOTS; s++) {
      var min = DAY_START + s * STEP;
      var t = document.createElement('div');
      t.className = 't' + (min % 60 ? ' half' : '');
      t.innerHTML = '<span class="hh">' + String(Math.floor(min / 60)).padStart(2, '0') +
        '</span><span class="mm">:' + String(min % 60).padStart(2, '0') + '</span>';
      tc.appendChild(t);
    }
    grid.appendChild(tc);

    // 여러 명이 함께하는 일정을 찾아 하나의 가로 막대로 묶는다
    var bands = groupBands(members);
    var inBand = {};
    bands.forEach(function (b) { b.group.forEach(function (e) { inBand[e.id] = true; }); });

    // 구성원 열
    members.forEach(function (m) {
      var col = document.createElement('div');
      col.className = 'mcol';
      for (var s = 0; s < SLOTS; s++) {
        var min = DAY_START + s * STEP;
        var slot = document.createElement('div');
        slot.className = 'slot' + (min % 60 === 0 ? ' hour' : '') + (min >= LUNCH_S && min < LUNCH_E ? ' lunch' : '');
        (function (mm, mid) {
          slot.addEventListener('click', function () { openAddModal(mid, mm); });
        })(min, m.id);
        col.appendChild(slot);
      }

      // 점심 라벨(첫 열에만 글자, 나머지는 배경만)
      if (m === members[0]) {
        var lb = document.createElement('div');
        lb.className = 'lunch-band';
        lb.style.top = minToY(LUNCH_S) + 'px';
        lb.style.height = (minToY(LUNCH_E) - minToY(LUNCH_S)) + 'px';
        lb.innerHTML = '<span>점심</span>';
        col.appendChild(lb);
      }

      // 빈 시간(회의 후보) 표시
      if (state.meetOpen) {
        state.freeWindows.forEach(function (w) {
          var f = document.createElement('div');
          f.className = 'free-band';
          f.style.top = minToY(w.start) + 'px';
          f.style.height = (minToY(w.end) - minToY(w.start)) + 'px';
          f.title = '이 시간에 회의 잡기 (' + fmtMin(w.start) + '~' + fmtMin(w.end) + ')';
          f.addEventListener('click', function () { openMeetingModal(w); });
          col.appendChild(f);
        });
      }

      // 일정 블록 — 서로 겹치는 것끼리만 폭을 나눠 나란히 배치
      var list = state.entries.filter(function (e) { return e.member_id === m.id && !inBand[e.id]; });
      layoutOverlaps(list).forEach(function (p) {
        var div = makeEntryEl([p.e], m.color || '#3E6288');
        if (!div) return;
        if (p.of > 1) {
          div.style.left = 'calc(' + (p.lane * 100 / p.of) + '% + 3px)';
          div.style.right = 'calc(' + ((p.of - 1 - p.lane) * 100 / p.of) + '% + 3px)';
        }
        col.appendChild(div);
      });

      // 오늘이면 현재 시각 표시선
      if (state.date === todayStr()) {
        var now = new Date();
        var nm = now.getHours() * 60 + now.getMinutes();
        if (nm >= DAY_START && nm <= DAY_END) {
          var ln = document.createElement('div');
          ln.className = 'now-line';
          ln.style.top = minToY(nm) + 'px';
          col.appendChild(ln);
        }
      }

      grid.appendChild(col);
    });

    var board = el('board');
    var sx = board.scrollLeft, sy = board.scrollTop;
    board.innerHTML = '';
    board.appendChild(grid);
    renderBands(grid, bands); // 열 위치를 재야 하므로 화면에 붙인 뒤에 그린다
    board.scrollLeft = sx; board.scrollTop = sy;
    // 처음 열었을 때는 지금 시각이 보이는 위치에서 시작
    if (!scrolledToNow && state.date === todayStr()) {
      scrolledToNow = true;
      var now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
      if (nm > DAY_START + 60) board.scrollTop = Math.max(0, minToY(nm) - SLOT_H * 2);
    }
  }
  var scrolledToNow = false;

  function minToY(min) { return (min - DAY_START) / STEP * SLOT_H; }
  function isCompact() { return window.innerWidth <= COMPACT_W && !state.wide; }

  // 같은 제목·시간·메모로 여러 명에게 등록된 일정 = 하나의 공통 일정으로 본다
  function groupKey(e) { return [e.title, e.start_min, e.end_min, e.memo || ''].join(''); }
  function groupOf(entry) {
    var k = groupKey(entry);
    return state.entries.filter(function (x) { return groupKey(x) === k; });
  }

  // 공통 일정 중 열이 이어져 있는 구간을 가로 막대(band)로 만든다
  function groupBands(members) {
    var idxOf = {};
    members.forEach(function (m, i) { idxOf[m.id] = i; });
    var groups = {};
    state.entries.forEach(function (e) {
      if (!(e.member_id in idxOf)) return;
      (groups[groupKey(e)] = groups[groupKey(e)] || []).push(e);
    });
    var bands = [];
    Object.keys(groups).forEach(function (k) {
      var g = groups[k];
      if (g.length < 2) return;
      g.sort(function (a, b) { return idxOf[a.member_id] - idxOf[b.member_id]; });
      var run = [];
      var flush = function () {
        if (run.length >= 2) {
          bands.push({ from: idxOf[run[0].member_id], to: idxOf[run[run.length - 1].member_id],
            group: run.slice(), total: g.length });
        }
        run = [];
      };
      g.forEach(function (e) {
        if (run.length && idxOf[e.member_id] !== idxOf[run[run.length - 1].member_id] + 1) flush();
        run.push(e);
      });
      flush();
    });
    return bands;
  }

  function renderBands(grid, bands) {
    if (!bands.length) return;
    var cols = grid.querySelectorAll('.mcol');
    if (!cols.length) return;
    var layer = document.createElement('div');
    layer.className = 'span-layer';
    bands.forEach(function (b) {
      var c1 = cols[b.from], c2 = cols[b.to];
      if (!c1 || !c2) return;
      var whole = b.group.length === state.members.length;
      var div = makeEntryEl(b.group, '#2A4A6B', whole ? '전원' : b.group.length + '명');
      if (!div) return;
      div.classList.add('band');
      div.style.left = (c1.offsetLeft + 3) + 'px';
      div.style.width = (c2.offsetLeft + c2.offsetWidth - c1.offsetLeft - 6) + 'px';
      div.style.top = (c1.offsetTop + parseFloat(div.style.top)) + 'px';
      layer.appendChild(div);
    });
    grid.appendChild(layer);
  }

  // 서로 겹치는 일정끼리 묶어 그 안에서만 폭을 나눈다 (겹치지 않으면 항상 전체 폭)
  function layoutOverlaps(list) {
    var sorted = list.slice().sort(function (a, b) {
      return a.start_min - b.start_min || a.end_min - b.end_min;
    });
    var out = [], cluster = [], lanes = [], clusterEnd = -1;
    function flush() {
      cluster.forEach(function (p) { p.of = lanes.length; });
      cluster = []; lanes = []; clusterEnd = -1;
    }
    sorted.forEach(function (e) {
      if (cluster.length && e.start_min >= clusterEnd) flush();
      var lane = -1;
      for (var i = 0; i < lanes.length; i++) if (lanes[i] <= e.start_min) { lane = i; break; }
      if (lane === -1) { lane = lanes.length; lanes.push(0); }
      lanes[lane] = e.end_min;
      clusterEnd = Math.max(clusterEnd, e.end_min);
      var p = { e: e, lane: lane, of: 1 };
      cluster.push(p); out.push(p);
    });
    flush();
    return out;
  }

  // 일정 블록 DOM 만들기 — group은 함께 움직이는 일정들(개인 일정이면 1개)
  function makeEntryEl(group, color, whoLabel) {
    var e = group[0];
    var top = minToY(Math.max(e.start_min, DAY_START));
    var bottom = minToY(Math.min(e.end_min, DAY_END));
    if (bottom <= 0 || top >= SLOTS * SLOT_H) return null;
    var div = document.createElement('div');
    div.className = 'entry';
    var h = Math.max(bottom - top - 4, 22);
    div.style.top = (top + 2) + 'px';
    div.style.height = h + 'px';
    if (h < 46) div.classList.add('short'); // 짧은 블록은 손잡이를 작게
    div.style.backgroundImage = 'linear-gradient(' + hexToRgba(color, .13) + ',' + hexToRgba(color, .13) + ')';
    div.style.borderColor = hexToRgba(color, .35);
    div.style.borderLeft = '4px solid ' + color;
    div.style.color = '#243B50';
    div.innerHTML = '<div class="rz rz-top"></div><b>' + esc(e.title) + '</b><span class="tm">' +
      fmtMin(e.start_min) + '~' + fmtMin(e.end_min) + '</span>' +
      (whoLabel ? '<span class="who">' + esc(whoLabel) + '</span>' : '') +
      '<div class="rz rz-bot"></div>';
    div.title = e.title + (e.memo ? '\n' + e.memo : '') +
      (whoLabel ? '\n함께: ' + group.map(function (x) { return memberName(x.member_id); }).join(', ') : '') +
      '\n(드래그: 이동 · 가장자리: 시간 조절)';
    div.addEventListener('pointerdown', function (ev) { startEntryDrag(ev, group, div); });
    return div;
  }
  function memberName(id) {
    var m = state.members.find(function (x) { return x.id === id; });
    return m ? m.name : '?';
  }

  // ── 일정 블록 드래그(이동) / 가장자리 리사이즈(시간 조절) ──
  // 손가락(터치)에서는 '길게 누르기'로 시작해야 실수로 옮겨지지 않는다.
  var dragActive = false;   // 드래그 중 자동 새로고침 중지용
  var dragArmed = false;    // 터치에서 길게 눌러 드래그가 시작된 상태
  var HOLD_MS = 320;

  // 드래그가 시작되면 화면이 같이 스크롤되지 않도록 막는다
  document.addEventListener('touchmove', function (ev) {
    if (dragArmed && ev.cancelable) ev.preventDefault();
  }, { passive: false });

  function startEntryDrag(ev, group, div) {
    if (ev.button !== undefined && ev.button !== 0) return; // 마우스 왼쪽 버튼만
    var touch = ev.pointerType === 'touch' || ev.pointerType === 'pen';
    var entry = group[0];
    var mode = ev.target.classList.contains('rz-top') ? 'top' :
               ev.target.classList.contains('rz-bot') ? 'bot' : 'move';
    var startY = ev.clientY;
    var baseTop = parseFloat(div.style.top) - minToY(entry.start_min); // 밴드는 헤더 높이만큼 더해져 있다
    var orig = { s: entry.start_min, e: entry.end_min };
    var cur = { s: orig.s, e: orig.e };
    var moved = false, armed = !touch, aborted = false, holdTimer = null;

    ev.stopPropagation();
    if (!touch) ev.preventDefault();
    try { div.setPointerCapture(ev.pointerId); } catch (ignored) {}

    if (touch) {
      // 손가락은 잠깐 누르고 있어야 드래그가 시작된다 (그 전에 움직이면 화면 스크롤)
      holdTimer = setTimeout(function () {
        if (aborted) return;
        armed = true; dragArmed = true; dragActive = true;
        div.classList.add('armed');
        if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
      }, HOLD_MS);
    } else {
      dragActive = true;
    }

    function apply(ns, ne) {
      cur.s = ns; cur.e = ne;
      div.style.top = (baseTop + minToY(ns)) + 'px';
      div.style.height = Math.max(minToY(ne) - minToY(ns) - 4, 20) + 'px';
      var tm = div.querySelector('.tm');
      if (tm) tm.textContent = fmtMin(ns) + '~' + fmtMin(ne);
      var lb = div.querySelector('.livetime');
      if (lb) lb.textContent = fmtMin(ns) + ' ~ ' + fmtMin(ne);
    }
    function onMove(e2) {
      var dy = e2.clientY - startY;
      if (!armed) {                       // 아직 길게 누르기 전 — 움직이면 드래그 취소(화면 스크롤)
        if (Math.abs(dy) > 8 || Math.abs(e2.clientX - ev.clientX) > 8) {
          aborted = true; clearTimeout(holdTimer); cleanup();
        }
        return;
      }
      if (!moved && Math.abs(dy) < (touch ? 3 : 5)) return; // 살짝 움직인 건 클릭으로 취급
      moved = true;
      div.classList.add('dragging');
      showLiveTime(div);
      var dmin = Math.round(dy / SLOT_H) * STEP;
      if (mode === 'move') {
        var dur = orig.e - orig.s;
        var ns = Math.min(Math.max(orig.s + dmin, DAY_START), DAY_END - dur);
        apply(ns, ns + dur);
      } else if (mode === 'top') {
        apply(Math.min(Math.max(orig.s + dmin, DAY_START), orig.e - STEP), orig.e);
      } else {
        apply(orig.s, Math.max(Math.min(orig.e + dmin, DAY_END), orig.s + STEP));
      }
    }
    function cleanup() {
      clearTimeout(holdTimer);
      dragActive = false; dragArmed = false;
      div.classList.remove('dragging'); div.classList.remove('armed');
      div.removeEventListener('pointermove', onMove);
      div.removeEventListener('pointerup', onUp);
      div.removeEventListener('pointercancel', onCancel);
    }
    async function onUp() {
      var wasAborted = aborted;
      cleanup();
      if (wasAborted) return;                              // 화면을 넘긴 것이므로 아무 일도 하지 않음
      if (!moved) { openEditModal(group); return; }        // 그냥 눌렀다 떼면 수정 창
      if (cur.s === orig.s && cur.e === orig.e) return;
      group.forEach(function (x) { x.start_min = cur.s; x.end_min = cur.e; }); // 화면 먼저 반영
      renderBoard();
      try {
        for (var i = 0; i < group.length; i++) {
          var x = group[i];
          await saveEntryRow({ id: x.id, date: state.date, member_id: x.member_id,
            start_min: cur.s, end_min: cur.e, title: x.title, memo: x.memo || '' });
        }
      } catch (ex) {
        group.forEach(function (x) { x.start_min = orig.s; x.end_min = orig.e; });
        renderBoard();
        alert(writeErrMsg(ex, '시간 변경을 저장하지 못했습니다. 다시 시도해 주세요.'));
      }
    }
    function onCancel() { apply(orig.s, orig.e); cleanup(); }
    div.addEventListener('pointermove', onMove);
    div.addEventListener('pointerup', onUp);
    div.addEventListener('pointercancel', onCancel);
  }

  // 드래그 중에는 시간을 큼직하게 띄워 준다 (좁은 화면에서 블록 글씨가 작아서)
  function showLiveTime(div) {
    if (div.querySelector('.livetime')) return;
    var b = document.createElement('div');
    b.className = 'livetime';
    div.appendChild(b);
  }

  // ── 회의 시간 찾기 ──
  function renderMeetPanel() {
    el('meetPanel').className = 'meet-panel' + (state.meetOpen ? ' open' : '');
    el('meetToggle').className = 'meet-btn' + (state.meetOpen ? ' on' : '');
    if (!state.meetOpen) return;

    var wrap = el('meetMembers');
    wrap.innerHTML = '';
    state.members.forEach(function (m) {
      if (!(m.id in state.meetSel)) state.meetSel[m.id] = true;
      var lb = document.createElement('label');
      lb.className = 'chip';
      lb.innerHTML = '<input type="checkbox" ' + (state.meetSel[m.id] ? 'checked' : '') + ' />' +
        '<span class="sw" style="background:' + esc(m.color || '#C7B48E') + '"></span>' + esc(m.name);
      lb.querySelector('input').addEventListener('change', function (ev) {
        state.meetSel[m.id] = ev.target.checked;
        computeFree(); renderBoard(); renderFreeList();
      });
      wrap.appendChild(lb);
    });
    computeFree();
    renderFreeList();
  }

  function computeFree() {
    var from = Number(el('meetFrom').value), to = Number(el('meetTo').value);
    var dur = Number(el('meetDur').value);
    var sel = state.members.filter(function (m) { return state.meetSel[m.id]; }).map(function (m) { return m.id; });
    state.freeWindows = [];
    if (!sel.length || to <= from) return;

    var busy = new Array(SLOTS).fill(false);
    if (el('meetSkipLunch').checked) {
      for (var li = (LUNCH_S - DAY_START) / STEP; li < (LUNCH_E - DAY_START) / STEP; li++) busy[li] = true;
    }
    state.entries.forEach(function (e) {
      if (sel.indexOf(e.member_id) === -1) return;
      var s = Math.max(e.start_min, DAY_START), en = Math.min(e.end_min, DAY_END);
      for (var i = Math.floor((s - DAY_START) / STEP); i < Math.ceil((en - DAY_START) / STEP); i++) {
        if (i >= 0 && i < SLOTS) busy[i] = true;
      }
    });
    var s0 = Math.max(0, (from - DAY_START) / STEP), s1 = Math.min(SLOTS, (to - DAY_START) / STEP);
    var runStart = -1;
    for (var i = s0; i <= s1; i++) {
      var free = i < s1 && !busy[i];
      if (free && runStart === -1) runStart = i;
      if (!free && runStart !== -1) {
        var st = DAY_START + runStart * STEP, en2 = DAY_START + i * STEP;
        if (en2 - st >= dur) state.freeWindows.push({ start: st, end: en2 });
        runStart = -1;
      }
    }
  }

  function renderFreeList() {
    var box = el('freeList');
    box.innerHTML = '';
    if (!state.freeWindows.length) {
      box.innerHTML = '<span class="free-none">조건에 맞는 공통 빈 시간이 없습니다. 시간대나 참석자를 조정해 보세요.</span>';
      return;
    }
    state.freeWindows.forEach(function (w) {
      var b = document.createElement('button');
      b.className = 'free-item';
      b.textContent = fmtMin(w.start) + ' ~ ' + fmtMin(w.end) + ' · 회의 잡기 +';
      b.addEventListener('click', function () { openMeetingModal(w); });
      box.appendChild(b);
    });
  }

  // ── 모달 ──
  function fillTimeSelects(startSel, endSel, s, e) {
    startSel.innerHTML = ''; endSel.innerHTML = '';
    for (var m = DAY_START; m < DAY_END; m += STEP) startSel.add(new Option(fmtMin(m), m));
    for (var m2 = DAY_START + STEP; m2 <= DAY_END; m2 += STEP) endSel.add(new Option(fmtMin(m2), m2));
    startSel.value = s; endSel.value = e;
  }
  function renderMemberChecks(checkedIds, disabled) {
    var box = el('fMembers');
    box.innerHTML = '';
    if (!disabled) {
      var all = document.createElement('button');
      all.type = 'button';
      all.className = 'chip';
      all.style.fontWeight = '700';
      all.textContent = '전체 선택/해제';
      all.addEventListener('click', function () {
        var cbs = box.querySelectorAll('input[type=checkbox]');
        var anyOff = Array.prototype.some.call(cbs, function (c) { return !c.checked; });
        Array.prototype.forEach.call(cbs, function (c) { c.checked = anyOff; });
      });
      box.appendChild(all);
    }
    state.members.forEach(function (m) {
      var lb = document.createElement('label');
      lb.className = 'chip';
      lb.innerHTML = '<input type="checkbox" value="' + esc(m.id) + '" ' +
        (checkedIds.indexOf(m.id) >= 0 ? 'checked' : '') + (disabled ? ' disabled' : '') + ' />' +
        '<span class="sw" style="background:' + esc(m.color || '#C7B48E') + '"></span>' + esc(m.name);
      box.appendChild(lb);
    });
  }
  function openAddModal(memberId, startMin) {
    editingGroup = null;
    el('entryModalTitle').textContent = '일정 추가';
    el('fTitle').value = ''; el('fMemo').value = '';
    fillTimeSelects(el('fStart'), el('fEnd'), startMin, Math.min(startMin + 60, DAY_END));
    renderMemberChecks([memberId], false);
    el('fDelete').style.display = 'none';
    showEntryModal();
  }
  function openAllModal() {
    editingGroup = null;
    el('entryModalTitle').textContent = '전체 일정 추가';
    el('fTitle').value = ''; el('fMemo').value = '';
    fillTimeSelects(el('fStart'), el('fEnd'), 9 * 60, 10 * 60);
    renderMemberChecks(state.members.map(function (m) { return m.id; }), false);
    el('fDelete').style.display = 'none';
    showEntryModal();
  }
  function openMeetingModal(w) {
    editingGroup = null;
    el('entryModalTitle').textContent = '회의 잡기';
    el('fTitle').value = '회의'; el('fMemo').value = '';
    fillTimeSelects(el('fStart'), el('fEnd'), w.start, w.end);
    var sel = state.members.filter(function (m) { return state.meetSel[m.id]; }).map(function (m) { return m.id; });
    renderMemberChecks(sel.length ? sel : state.members.map(function (m) { return m.id; }), false);
    el('fDelete').style.display = 'none';
    showEntryModal();
  }
  function openEditModal(group) {
    var g = Array.isArray(group) ? groupOf(group[0]) : groupOf(group); // 항상 최신 그룹으로
    editingGroup = g;
    var e = g[0];
    el('entryModalTitle').textContent = g.length > 1
      ? (g.length === state.members.length ? '전체 일정 수정' : '공통 일정 수정 (' + g.length + '명)')
      : '일정 수정';
    el('fTitle').value = e.title; el('fMemo').value = e.memo || '';
    fillTimeSelects(el('fStart'), el('fEnd'), e.start_min, e.end_min);
    renderMemberChecks(g.map(function (x) { return x.member_id; }), false);
    el('fDelete').style.display = '';
    el('fDelete').textContent = g.length > 1 ? '전체 삭제' : '삭제';
    showEntryModal();
  }
  function showEntryModal() {
    el('fErr').className = 'err';
    el('entryModalBg').classList.add('open');
    setTimeout(function () { el('fTitle').focus(); }, 50);
  }
  function closeEntryModal() { el('entryModalBg').classList.remove('open'); }

  async function submitEntry() {
    var title = el('fTitle').value.trim();
    var s = Number(el('fStart').value), e = Number(el('fEnd').value);
    var err = el('fErr');
    var ids = Array.prototype.slice.call(document.querySelectorAll('#fMembers input:checked'))
      .map(function (c) { return c.value; });
    if (!title) { err.textContent = '제목을 입력해 주세요.'; err.className = 'err show'; return; }
    if (e <= s) { err.textContent = '끝나는 시간이 시작 시간보다 늦어야 합니다.'; err.className = 'err show'; return; }

  // ── 엑셀 칸 해석 (엑셀에서 다시 저장하면 형식이 바뀔 수 있어 넉넉하게 받아들인다) ──
  function pad2(n) { return String(n).padStart(2, '0'); }
  function parseDateCell(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date && !isNaN(v)) {
      return v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
    }
    if (typeof v === 'number' && v > 1000) {           // 엑셀 날짜 일련번호
      var d = new Date(Math.round((v - 25569) * 86400000));
      return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
    }
    var s = String(v).trim().replace(/[.\/]/g, '-').replace(/\s+/g, '').replace(/-+$/, '');
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
    m = s.match(/^(\d{1,2})-(\d{1,2})$/);              // '8-17' → 올해로
    if (m) return new Date().getFullYear() + '-' + pad2(m[1]) + '-' + pad2(m[2]);
    return null;
  }
  function parseTimeCell(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return v.getHours() * 60 + v.getMinutes();
    if (typeof v === 'number') {
      if (v > 0 && v < 1) return Math.round(v * 1440);   // 엑셀 시간(하루의 비율)
      if (v >= 1 && v <= 24) return Math.round(v * 60);  // '9' → 09:00
      return null;
    }
    var s = String(v).trim();
    var pm = /오후|PM/i.test(s), am = /오전|AM/i.test(s);
    var m = s.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?/);
    if (!m) {
      var only = s.match(/^(\d{1,2})$/);
      if (!only) return null;
      m = [null, only[1], '0'];
    }
    var h = Number(m[1]), mi = Number(m[2] || 0);
    if (pm && h < 12) h += 12;
    if (am && h === 12) h = 0;
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }

  // ── 내려받기 ──
  async function downloadXlsx() {
    var btn = el('xlDown'), from = el('xlFrom').value, to = el('xlTo').value;
    if (!from || !to || to < from) { alert('기간을 확인해 주세요.'); return; }
    var days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
    if (days > 62) { alert('한 번에 최대 62일까지 받을 수 있습니다.'); return; }
    btn.disabled = true; btn.textContent = '만드는 중…';
    try {
      var X = await loadXLSX();
      var rows = [['날짜', '이름', '시작', '종료', '일정', '메모']];
      var members = state.members;
      for (var i = 0; i < days; i++) {
        var d = shiftDate(from, i);
        var data = await fetchDayData(d);
        if (data.members && data.members.length) members = data.members;
        var byId = {};
        members.forEach(function (m) { byId[m.id] = m.name; });
        (data.entries || []).slice()
          .sort(function (a, b) {
            return (members.findIndex(function (m) { return m.id === a.member_id; }) -
                    members.findIndex(function (m) { return m.id === b.member_id; })) ||
                   (a.start_min - b.start_min);
          })
          .forEach(function (e) {
            rows.push([d, byId[e.member_id] || '?', fmtMin(e.start_min), fmtMin(e.end_min),
              e.title || '', e.memo || '']);
          });
      }
      var ws = X.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{ wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 8 }, { wch: 28 }, { wch: 32 }];
      var wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, ws, '일정');
      var help = [['일정표 엑셀 — 작성 방법'], [''],
        ['1. "일정" 시트에 한 줄에 일정 하나씩 적습니다.'],
        ['2. 날짜: 2026-08-17 형식 (비워 두면 올릴 때 보고 있던 날짜로 들어갑니다)'],
        ['3. 이름: 아래 팀원 명단과 똑같이 적어 주세요.'],
        ['4. 시작 / 종료: 09:00, 14:30 처럼 적습니다. (오전 9시, 9시 30분 도 인식합니다)'],
        ['5. 일정: 표에 표시될 제목입니다. 메모는 비워도 됩니다.'],
        ['6. 화면에 보이는 시간대는 06:00~22:00 입니다.'], [''],
        ['※ 여러 사람이 함께하는 일정은 사람마다 한 줄씩 적으면 한 줄 막대로 합쳐집니다.'], [''],
        ['[ 팀원 명단 ]']];
      members.forEach(function (m) { help.push([m.name]); });
      var wsh = X.utils.aoa_to_sheet(help);
      wsh['!cols'] = [{ wch: 60 }];
      X.utils.book_append_sheet(wb, wsh, '작성방법');
      // 파일명은 영문으로 — 한글 파일명을 지우고 'download'로 저장해 버리는 환경이 있다
      saveFile(X.write(wb, { bookType: 'xlsx', type: 'array' }),
        'team-schedule_' + from + (from === to ? '' : '_' + to) + '.xlsx');
    } catch (ex) {
      alert('엑셀 파일을 만들지 못했습니다. 잠시 후 다시 시도해 주세요.');
    }
    btn.disabled = false; btn.textContent = '엑셀 파일 받기';
  }

  // ── 올리기 ──
  var pendingUpload = null;
  async function readUploadFile(file) {
    var box = el('xlPreview');
    box.innerHTML = '<div class="sum">파일을 읽는 중…</div>';
    el('xlUpload').style.display = 'none';
    pendingUpload = null;
    try {
      var X = await loadXLSX();
      var buf = await file.arrayBuffer();
      var wb = X.read(buf, { type: 'array', cellDates: true });
      var sheetName = wb.SheetNames.filter(function (n) { return n !== '작성방법'; })[0] || wb.SheetNames[0];
      var aoa = X.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: '' });

      // 머리글 줄 찾기 (없으면 날짜·이름·시작·종료·일정·메모 순서로 간주)
      var col = { date: 0, name: 1, start: 2, end: 3, title: 4, memo: 5 }, first = 0, found = false;
      for (var i = 0; i < Math.min(aoa.length, 10) && !found; i++) {
        var head = (aoa[i] || []).map(function (c) { return String(c == null ? '' : c).replace(/\s/g, ''); });
        if (head.indexOf('이름') === -1) continue;
        found = true; first = i + 1;
        col = { date: -1, name: -1, start: -1, end: -1, title: -1, memo: -1 };
        head.forEach(function (h, k) {
          if (/^날짜/.test(h)) col.date = k;
          else if (/^(이름|팀원|담당)/.test(h)) col.name = k;
          else if (/^시작/.test(h)) col.start = k;
          else if (/^(종료|끝)/.test(h)) col.end = k;
          else if (/^(일정|제목|내용)/.test(h)) col.title = k;
          else if (/^(메모|비고)/.test(h)) col.memo = k;
        });
      }

      var byName = {};
      state.members.forEach(function (m) { byName[m.name.replace(/\s/g, '')] = m; });
      var ok = [], bad = [], newNames = [], dates = {}, outside = 0;
      for (var r = first; r < aoa.length; r++) {
        var row = aoa[r] || [];
        var cell = function (k) { return k >= 0 ? row[k] : ''; };
        var name = String(cell(col.name) || '').trim();
        var title = String(cell(col.title) || '').trim();
        var rawDate = cell(col.date), rawS = cell(col.start), rawE = cell(col.end);
        if (!name && !title && !rawS && !rawE && !rawDate) continue; // 빈 줄
        var lineNo = r + 1;
        var date = rawDate === '' || rawDate == null ? state.date : parseDateCell(rawDate);
        var s = parseTimeCell(rawS), e2 = parseTimeCell(rawE);
        if (!date) { bad.push(lineNo + '번째 줄: 날짜 형식을 알 수 없습니다 (' + rawDate + ')'); continue; }
        if (!name) { bad.push(lineNo + '번째 줄: 이름이 비어 있습니다'); continue; }
        if (!title) { bad.push(lineNo + '번째 줄: 일정(제목)이 비어 있습니다'); continue; }
        if (s == null || e2 == null) { bad.push(lineNo + '번째 줄: 시간 형식을 알 수 없습니다 (' + rawS + ' ~ ' + rawE + ')'); continue; }
        if (e2 <= s) { bad.push(lineNo + '번째 줄: 종료 시간이 시작보다 빠릅니다'); continue; }
        var key = name.replace(/\s/g, '');
        if (!byName[key] && newNames.indexOf(name) === -1) newNames.push(name);
        if (s < DAY_START || e2 > DAY_END) outside++;
        dates[date] = true;
        ok.push({ date: date, name: name, key: key, start_min: s, end_min: e2,
          title: title.slice(0, 60), memo: String(cell(col.memo) || '').slice(0, 500) });
      }

      var dateList = Object.keys(dates).sort();
      var html = '<div class="sum">등록할 일정 <b>' + ok.length + '건</b>' +
        (dateList.length ? ' · 날짜 <b>' + dateList[0] + (dateList.length > 1 ? ' ~ ' + dateList[dateList.length - 1] : '') + '</b>' : '') +
        (newNames.length ? '<br>명단에 없는 이름: <b>' + newNames.map(esc).join(', ') + '</b>' : '') + '</div>';
      if (outside) html += '<div class="warn">' + outside + '건은 화면 표시 범위(06:00~22:00) 밖이라 표에 보이지 않을 수 있습니다.</div>';
      if (bad.length) html += '<div class="bad"><b>확인이 필요한 줄 ' + bad.length + '개</b><br>' +
        bad.slice(0, 20).map(esc).join('<br>') + (bad.length > 20 ? '<br>…' : '') + '</div>';
      box.innerHTML = html;

      if (ok.length) {
        pendingUpload = { rows: ok, newNames: newNames, dates: dateList };
        el('xlUpload').style.display = '';
        el('xlUpload').textContent = ok.length + '건 등록하기';
      }
    } catch (ex) {
      box.innerHTML = '<div class="bad">파일을 읽지 못했습니다. 엑셀(.xlsx) 또는 CSV 파일인지 확인해 주세요.</div>';
    }
  }

  async function commitUpload() {
    if (!pendingUpload) return;
    var btn = el('xlUpload');
    btn.disabled = true; btn.textContent = '등록 중…';
    try {
      var byName = {};
      state.members.forEach(function (m) { byName[m.name.replace(/\s/g, '')] = m; });

      // 명단에 없는 이름 처리
      if (pendingUpload.newNames.length) {
        if (!el('xlAddMembers').checked) {
          var known = pendingUpload.rows.filter(function (r) { return byName[r.key]; });
          if (!known.length) throw new Error('no-member');
          pendingUpload.rows = known;
        } else {
          for (var n = 0; n < pendingUpload.newNames.length; n++) {
            var nm = pendingUpload.newNames[n];
            await addMemberRow(nm);
          }
          var fresh = await fetchDayData(state.date);
          (fresh.members || []).forEach(function (m) { byName[m.name.replace(/\s/g, '')] = m; });
        }
      }

      if (el('xlReplace').checked) {
        for (var d = 0; d < pendingUpload.dates.length; d++) await deleteDayEntries(pendingUpload.dates[d]);
      }

      var rows = [];
      pendingUpload.rows.forEach(function (r, i) {
        var m = byName[r.key];
        if (!m) return;
        rows.push({ id: uid() + '-' + i, date: r.date, member_id: m.id,
          start_min: r.start_min, end_min: r.end_min, title: r.title, memo: r.memo });
      });
      if (!rows.length) throw new Error('empty');
      await saveEntriesBulk(rows);

      el('xlModalBg').classList.remove('open');
      pendingUpload = null;
      await loadDay(true);
      alert(rows.length + '건이 등록되었습니다.');
    } catch (ex) {
      alert(writeErrMsg(ex, ex && ex.message === 'no-member'
        ? '명단에 없는 이름뿐입니다. "명단에 없는 이름은 팀원으로 추가"를 켜거나 이름을 맞춰 주세요.'
        : '등록에 실패했습니다. 잠시 후 다시 시도해 주세요.'));
    }
    btn.disabled = false;
    if (pendingUpload) btn.textContent = pendingUpload.rows.length + '건 등록하기';
  }

  // ══ 하루 일정표를 이미지로 만들어 복사/공유 ══════════════════
  function rr(ctx, x, y, w, h, r) { // 둥근 사각형 경로
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function ellipsize(ctx, text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }

  function makeDayImage() {
    var members = state.members;
    var entries = state.entries;
    var FONT = '-apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif';

    // 시간 범위: 기본 09~18시, 일정이 벗어나면 그만큼 넓힌다
    var from = 9 * 60, to = 18 * 60;
    entries.forEach(function (e) {
      from = Math.min(from, Math.floor(e.start_min / 60) * 60);
      to = Math.max(to, Math.ceil(e.end_min / 60) * 60);
    });
    from = Math.max(DAY_START, from); to = Math.min(DAY_END, to);

    var S = 2; // 해상도 배율(선명하게)
    var pad = 20, timeW = 50, headH = 42, titleH = 58, footH = 30, slotH = 27;
    var colW = Math.max(112, Math.min(148, Math.round(1080 / Math.max(members.length, 1))));
    var slots = (to - from) / STEP;
    var W = pad * 2 + timeW + colW * members.length;
    var H = pad + titleH + headH + slots * slotH + footH + pad * 0.5;
    var cv = document.createElement('canvas');
    cv.width = W * S; cv.height = H * S;
    var ctx = cv.getContext('2d');
    ctx.scale(S, S);
    var gx = pad + timeW;                       // 표 왼쪽
    var gy = pad + titleH + headH;              // 표(시간칸) 위쪽
    var gw = colW * members.length;
    var yOf = function (min) { return gy + (min - from) / STEP * slotH; };

    // 바탕 + 제목
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#C7B48E';
    ctx.fillRect(0, 0, W, 4);
    var p = state.date.split('-');
    ctx.fillStyle = '#1E3A50';
    ctx.font = '900 21px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.fillText(p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일 (' + dowKo(state.date) + ') 팀 일정',
      pad, pad + 24);
    ctx.font = '500 12px ' + FONT;
    ctx.fillStyle = '#A9884F';
    ctx.textAlign = 'right';
    ctx.fillText('팀 일정 공유 · Daily Timetable', W - pad, pad + 24);
    ctx.textAlign = 'left';

    // 머리글 (이름 줄)
    ctx.fillStyle = '#2A4A6B';
    rr(ctx, pad, pad + titleH, timeW + gw, headH, 10);
    ctx.fill();
    ctx.fillStyle = '#1F3A55';
    rr(ctx, pad, pad + titleH, timeW, headH, 10);
    ctx.fill();
    ctx.fillRect(pad + 10, pad + titleH, timeW - 10, headH); // 모서리 정리
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 12px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('시간', pad + timeW / 2, pad + titleH + headH / 2);
    members.forEach(function (m, i) {
      var cx = gx + colW * i + colW / 2;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 13px ' + FONT;
      ctx.fillText(ellipsize(ctx, m.name, colW - 14), cx, pad + titleH + headH / 2 - 2);
      ctx.fillStyle = m.color || '#C7B48E';
      ctx.fillRect(gx + colW * i + 6, pad + titleH + headH - 5, colW - 12, 3);
    });

    // 점심 배경
    if (LUNCH_S < to && LUNCH_E > from) {
      var ls = Math.max(LUNCH_S, from), le = Math.min(LUNCH_E, to);
      ctx.fillStyle = '#FAF7F0';
      ctx.fillRect(gx, yOf(ls), gw, yOf(le) - yOf(ls));
      ctx.fillStyle = '#C9B78C';
      ctx.font = '700 11px ' + FONT;
      ctx.fillText('점 심', gx + gw / 2, (yOf(ls) + yOf(le)) / 2);
    }

    // 눈금
    for (var min = from; min <= to; min += STEP) {
      var yy = yOf(min);
      ctx.strokeStyle = (min % 60 === 0) ? '#DCE4EC' : '#EDF1F5';
      ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + gw, yy); ctx.stroke();
      if (min % 60 === 0 && min < to) {
        ctx.fillStyle = '#4E6076';
        ctx.font = '600 11px ' + FONT;
        ctx.textAlign = 'right';
        ctx.fillText(fmtMin(min), pad + timeW - 8, yy + 9);
        ctx.textAlign = 'center';
      }
    }
    for (var c = 0; c <= members.length; c++) {
      ctx.strokeStyle = '#DCE4EC';
      ctx.beginPath(); ctx.moveTo(gx + colW * c, gy); ctx.lineTo(gx + colW * c, yOf(to)); ctx.stroke();
    }
    ctx.strokeStyle = '#DCE4EC';
    ctx.beginPath(); ctx.moveTo(pad, yOf(to)); ctx.lineTo(gx + gw, yOf(to)); ctx.stroke();

    // 일정 블록 하나 그리기
    function drawBlock(x, w, sMin, eMin, color, title, timeText, badge) {
      var y1 = yOf(Math.max(sMin, from)), y2 = yOf(Math.min(eMin, to));
      if (y2 - y1 < 8) return;
      ctx.save();
      rr(ctx, x, y1 + 1.5, w, y2 - y1 - 3, 6);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.fillStyle = hexToRgba(color, .14); ctx.fill();
      ctx.strokeStyle = hexToRgba(color, .45); ctx.stroke();
      ctx.clip();
      ctx.fillStyle = color;
      ctx.fillRect(x, y1 + 1.5, 3.5, y2 - y1 - 3);
      ctx.fillStyle = '#243B50';
      ctx.textAlign = 'left';
      ctx.font = '700 12px ' + FONT;
      var textW = w - 14 - (badge ? ctx.measureText(badge).width + 30 : 0);
      var tall = (y2 - y1) >= 34;
      ctx.fillText(ellipsize(ctx, title, textW), x + 9, y1 + (tall ? 12 : (y2 - y1) / 2 + 1));
      if (tall) {
        ctx.font = '500 10px ' + FONT;
        ctx.fillStyle = 'rgba(36,59,80,.62)';
        ctx.fillText(ellipsize(ctx, timeText, w - 14), x + 9, y1 + 26);
      }
      if (badge) {
        ctx.font = '700 10px ' + FONT;
        var bw = ctx.measureText(badge).width + 14;
        ctx.fillStyle = 'rgba(42,74,107,.78)';
        rr(ctx, x + w - bw - 7, y1 + (y2 - y1) / 2 - 8, bw, 16, 8);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.fillText(badge, x + w - bw / 2 - 7, y1 + (y2 - y1) / 2 + 1);
        ctx.textAlign = 'left';
      }
      ctx.restore();
    }

    // 공통 일정(막대) + 개인 일정 — 화면과 같은 규칙으로
    var bands = groupBands(members);
    var inBand = {};
    bands.forEach(function (b) { b.group.forEach(function (e) { inBand[e.id] = true; }); });
    members.forEach(function (m, i) {
      var list = entries.filter(function (e) { return e.member_id === m.id && !inBand[e.id]; });
      layoutOverlaps(list).forEach(function (pl) {
        var w = (colW - 8) / pl.of;
        drawBlock(gx + colW * i + 4 + w * pl.lane, w - (pl.of > 1 ? 2 : 0),
          pl.e.start_min, pl.e.end_min, m.color || '#3E6288',
          pl.e.title, fmtMin(pl.e.start_min) + '~' + fmtMin(pl.e.end_min), null);
      });
    });
    bands.forEach(function (b) {
      var e = b.group[0];
      var whole = b.group.length === members.length;
      drawBlock(gx + colW * b.from + 4, colW * (b.to - b.from + 1) - 8,
        e.start_min, e.end_min, '#2A4A6B', e.title,
        fmtMin(e.start_min) + '~' + fmtMin(e.end_min), whole ? '전원' : b.group.length + '명');
    });

    // 하단 표기
    ctx.fillStyle = '#8CA0B3';
    ctx.font = '500 10.5px ' + FONT;
    ctx.textAlign = 'right';
    var now = new Date();
    ctx.fillText(location.host + ' · ' + String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') + ' 기준', W - pad, H - 16);
    ctx.textAlign = 'left';
    return cv;
  }

  async function copyDayImage() {
    var btn = el('copyBtn');
    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '만드는 중…';
    try {
      var cv = makeDayImage();
      var blobPromise = new Promise(function (res, rej) {
        cv.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/png');
      });
      var fname = 'schedule_' + state.date + '.png';

      // 휴대폰: 공유 시트에서 카톡·텔레그램을 바로 고를 수 있게
      if (document.body.classList.contains('touch') && navigator.canShare) {
        var blob = await blobPromise;
        var file = new File([blob], fname, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: '팀 일정 ' + state.date });
            btn.disabled = false; btn.textContent = oldText;
            return;
          } catch (shareErr) {
            if (shareErr && shareErr.name === 'AbortError') { // 사용자가 닫음
              btn.disabled = false; btn.textContent = oldText;
              return;
            } // 그 외 실패 → 아래 클립보드로
          }
        }
      }

      // PC(또는 공유 불가): 클립보드에 이미지 복사
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
        showToast('📋 일정표 이미지가 복사되었습니다.<br>카톡·텔레그램 채팅창에 <b>붙여넣기(Ctrl+V)</b> 하세요.');
      } else {
        saveFile(await blobPromise, fname, 'image/png'); // 마지막 수단: 파일로 저장
        showToast('이미지 파일로 저장했습니다.<br>저장된 사진을 공유해 주세요.');
      }
    } catch (ex) {
      try {
        saveFile(await new Promise(function (res) { makeDayImage().toBlob(res, 'image/png'); }),
          'schedule_' + state.date + '.png', 'image/png');
        showToast('복사 대신 이미지 파일로 저장했습니다.<br>저장된 사진을 공유해 주세요.');
      } catch (ex2) {
        alert('이미지를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.');
      }
    }
    btn.disabled = false;
    btn.textContent = oldText;
  }
  el('copyBtn').addEventListener('click', copyDayImage);

  el('xlBtn').addEventListener('click', openXlModal);
  el('xlClose').addEventListener('click', function () { el('xlModalBg').classList.remove('open'); });
  el('xlModalBg').addEventListener('click', function (ev) {
    if (ev.target === ev.currentTarget) ev.currentTarget.classList.remove('open');
  });
  el('xlDown').addEventListener('click', downloadXlsx);
  el('xlFile').addEventListener('change', function (ev) {
    if (ev.target.files && ev.target.files[0]) readUploadFile(ev.target.files[0]);
  });
  el('xlUpload').addEventListener('click', commitUpload);

  // 손가락으로 쓰는 기기 표시 (손잡이 크기·길게 누르기 안내에 사용)
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    document.body.classList.add('touch');
    if (!localStorage.getItem('mlk-sched-hint')) {
      localStorage.setItem('mlk-sched-hint', '1');
      setTimeout(function () {
        var t = document.createElement('div');
        t.className = 'hint-toast';
        t.innerHTML = '일정을 <b>길게 누른 뒤</b> 끌면 시간이 옮겨집니다.<br>위·아래 <b>손잡이</b>를 끌면 시작/끝 시간이 조절돼요.';
        document.body.appendChild(t);
        setTimeout(function () { t.classList.add('out'); }, 5200);
        setTimeout(function () { t.remove(); }, 6000);
      }, 1200);
    }
  }

  // 좁은 화면에서 '한 화면에 보기' ↔ '넓게 보기' 전환
  function syncWideBtn() {
    el('wideBtn').textContent = state.wide ? '⤢ 한 화면' : '↔ 넓게';
    el('wideBtn').title = state.wide
      ? '팀원 전체가 한 화면에 들어오도록 줄이기'
      : '글씨를 키워 넓게 보기 (가로로 넘겨서 확인)';
  }
  el('wideBtn').addEventListener('click', function () {
    state.wide = !state.wide;
    localStorage.setItem('mlk-sched-wide', state.wide ? '1' : '0');
    syncWideBtn();
    renderBoard();
  });
  syncWideBtn();

  // 화면 회전·크기 변경 시 다시 계산
  var resizeTimer = null, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderBoard, 150);
  });

  // ── 앱으로 설치(PWA) ──
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    installPrompt = ev;
    if (!isStandalone()) el('installBtn').style.display = '';
  });
  window.addEventListener('appinstalled', function () {
    installPrompt = null; el('installBtn').style.display = 'none';
  });
  el('installBtn').addEventListener('click', async function () {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      el('installBtn').style.display = 'none';
      return;
    }
    alert('홈 화면에 앱으로 추가하기\n\n' +
      '• 아이폰(Safari): 아래 공유 버튼 → "홈 화면에 추가"\n' +
      '• 안드로이드(Chrome): 오른쪽 위 ⋮ → "앱 설치" 또는 "홈 화면에 추가"\n' +
      '• PC(Chrome/Edge): 주소창 오른쪽 설치 아이콘');
  });
  // 아이폰 사파리는 설치 이벤트가 없어 버튼을 직접 띄운다
  if (/iP(hone|ad|od)/.test(navigator.userAgent) && !isStandalone()) {
    el('installBtn').style.display = '';
  }
  // 인터넷이 돌아오면 자동으로 다시 연결
  window.addEventListener('online', function () {
    if (state.mode === 'offline') { state.mode = null; state.serverErr = null; loadDay(true); }
  });

  // 30초마다, 그리고 탭에 다시 돌아왔을 때 자동 새로고침 (팀원이 올린 일정 반영)
  setInterval(function () {
    if (dragActive || el('entryModalBg').classList.contains('open')) return;
    if (state.mode === 'server') loadDay(true);
    else if (state.mode === 'offline') { state.mode = null; state.serverErr = null; loadDay(true); }
  }, 30000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      if (state.mode === 'offline') { state.mode = null; state.serverErr = null; }
      loadDay(true);
    }
  });

  loadDay();
})();
</script>
